modules:
  macro:
    - key: team-pulse-board-macro
      resource: macro-ui
      resolver:
        function: resolver
      render: native
      title: Team Pulse Board
      description: Finds Jira tickets related to this Confluence page by extracting
        distinctive words from the page title and running the JQL search for you —
        grouped by status. Match words are editable in the UI.

  # Minimal Jira surface. The macro lives in Confluence, but the resolver calls
  # Jira REST APIs — so the app must also be installed in Jira. Forge requires
  # at least one Jira module for `forge install --product jira` to work; this
  # global page satisfies that requirement without adding UI noise.
  jira:globalPage:
    - key: team-pulse-board-jira-about
      resource: jira-about-ui
      render: native
      title: Team Pulse Board
      icon: https://developer.atlassian.com/platform/forge/images/icons/task.svg

  function:
    - key: resolver
      handler: index.handler

resources:
  - key: macro-ui
    path: src/frontend/index.jsx
  - key: jira-about-ui
    path: src/frontend/jira-about.jsx

permissions:
  scopes:
    - read:jira-work
    - read:jira-user
    - read:confluence-user
    - read:confluence-content.summary
    - read:page:confluence

app:
  runtime:
    name: nodejs22.x
  # id is populated by `forge register` — leave commented until then.
  # id: ari:cloud:ecosystem::app/YOUR-APP-ID-HERE
