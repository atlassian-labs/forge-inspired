modules:
  macro:
    - key: team-pulse-board-macro
      resource: macro-ui
      resolver:
        function: resolver
      render: native
      title: Team Pulse Board
      description: Finds Jira tickets related to this Confluence page by extracting
        distinctive words from the page title and running the JQL search for you —
        grouped by status. Match words are editable in the UI.

  # Why a Jira module exists at all in a "Confluence macro" app:
  # -------------------------------------------------------------
  # The macro's resolver calls the Jira REST API (`requestJira`). Jira
  # rejects those calls with 403 "The app is not installed on this
  # instance" unless the app is explicitly installed in Jira. To install
  # in Jira, the manifest must declare at least one Jira module.
  #
  # We use `jira:adminPage` (not `jira:globalPage`) so the surface only
  # appears under Jira Settings → Apps, visible only to Jira admins —
  # not in every user's top navigation. The page itself is intentional:
  # it explains to admins why the app is installed in Jira and points
  # them back to Confluence, where the actual functionality lives.
  jira:adminPage:
    - key: team-pulse-board-jira-about
      resource: jira-about-ui
      render: native
      title: Team Pulse Board
      icon: https://developer.atlassian.com/platform/forge/images/icons/task.svg

  function:
    - key: resolver
      handler: index.handler

resources:
  - key: macro-ui
    path: src/frontend/index.jsx
  - key: jira-about-ui
    path: src/frontend/jira-about.jsx

permissions:
  scopes:
    - read:jira-work
    - read:jira-user
    - read:confluence-user
    - read:confluence-content.summary
    - read:page:confluence

app:
  runtime:
    name: nodejs22.x
  # id is populated by `forge register` — leave commented until then.
  # id: ari:cloud:ecosystem::app/YOUR-APP-ID-HERE
